# ═══════════════════════════════════════════════════════════
# ServerWatch — Nginx config mẫu cho external reverse proxy
# Domain: monitor.example.com  (đổi thành domain của bạn)
#
# Cài đặt (ví dụ với container nginx tên "external-nginx"):
#   docker cp monitor.example.com.conf external-nginx:/etc/nginx/conf.d/
#   docker exec external-nginx nginx -s reload
# ═══════════════════════════════════════════════════════════

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name monitor.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name monitor.example.com;

    # Thay bằng đường dẫn cert thật của bạn (Let's Encrypt hoặc tự ký)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 5M;

    # ── Dashboard ────────────────────────────────────────
    location / {
        proxy_pass http://sw-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── WebSocket (real-time metrics) ────────────────────
    location /ws {
        proxy_pass http://sw-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── API ──────────────────────────────────────────────
    location /api/ {
        proxy_pass http://sw-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ── Health check ─────────────────────────────────────
    location = /health {
        proxy_pass http://sw-server:8000;
    }

    # ── Chặn file ẩn ────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
