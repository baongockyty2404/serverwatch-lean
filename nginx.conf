# ═══════════════════════════════════════════════════════════
# ServerWatch — Nginx Internal Proxy
# Nhận traffic từ external-nginx → route đến sw-server
# SSL được xử lý bởi external-nginx, ở đây chỉ HTTP
# ═══════════════════════════════════════════════════════════

upstream serverwatch_api {
    server server:8000;
}

# ── Rate limiting ─────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ws:10m  rate=5r/s;

server {
    listen 80;
    server_name _;

    # ── Bảo mật headers ──────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"       always;
    add_header X-Content-Type-Options     "nosniff"           always;
    add_header X-XSS-Protection           "1; mode=block"    always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy     "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; connect-src 'self' wss: ws:;" always;
    add_header Strict-Transport-Security   "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;

    # ── Ẩn server version ────────────────────────────────
    server_tokens off;

    # ── Giới hạn body size ───────────────────────────────
    client_max_body_size 20m;

    # ── Dashboard (static) ───────────────────────────────
    location = / {
        root /usr/share/nginx/html;
        try_files /dashboard.html =404;
        expires 5m;
    }

    location = /dashboard.html {
        root /usr/share/nginx/html;
        expires 5m;
    }

    # ── WebSocket ────────────────────────────────────────
    location /ws {
        limit_req zone=ws burst=3 nodelay;

        proxy_pass         http://serverwatch_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── API ──────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://serverwatch_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── Health check (không rate limit) ──────────────────
    location = /health {
        proxy_pass http://serverwatch_api;
    }

    # ── Chặn mọi thứ khác ───────────────────────────────
    location / {
        return 404;
    }
}
